name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "build/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand --coverage
      - run: npm run test:database
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3101

  smoke:
    # Playwright 1.58.2 has no browser build for the image ubuntu-latest now
    # points at (26.04), so the browser install fails before any test runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/wgd-browser" --no-save --package-lock=false playwright@1.58.2
      - run: '"$RUNNER_TEMP/wgd-browser/node_modules/.bin/playwright" install --with-deps --only-shell chromium'
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3101
      - run: npm run test:smoke
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/wgd-browser/node_modules/playwright/index.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure
          path: smoke-verification/
