name: Verify performance and scoring usability

on:
  push:
    branches: ["build/performance-usability"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/wgd-browser" --no-save --package-lock=false playwright@1.58.2
      - run: '"$RUNNER_TEMP/wgd-browser/node_modules/.bin/playwright" install --only-shell chromium'
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3101
      - run: node scripts/verify-performance.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/wgd-browser/node_modules/playwright/index.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-usability-verification
          path: performance-verification/
