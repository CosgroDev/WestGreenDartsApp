name: Investigate public league data
on:
  push:
    branches: ["build/live-league-snapshot"]
    paths: ["scripts/investigate-league.mjs", ".github/workflows/investigate-league.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --only-shell chromium
      - run: npm run build
      - run: node scripts/investigate-league.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-league-investigation
          path: league-investigation/
